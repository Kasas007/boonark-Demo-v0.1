<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking — Boonark</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

    <style>
        /* FullCalendar dark theme */
        :root {
            --fc-border-color: #2a2a2a;
            --fc-today-bg-color: rgba(255, 193, 7, 0.08);
            --fc-page-bg-color: #111;
            --fc-neutral-bg-color: #161616;
            --fc-event-bg-color: #1a3220;
            --fc-event-border-color: #28a745;
            --fc-event-text-color: #d0d0d0;
        }

        .fc { color: #ccc; }

        .fc-toolbar-title {
            color: #ffc107 !important;
            font-weight: 800 !important;
            font-size: 1.4rem !important;
        }

        .fc-button-primary {
            background: transparent !important;
            border: 1px solid #ffc107 !important;
            color: #ffc107 !important;
            box-shadow: none !important;
        }

        .fc-button-primary:hover,
        .fc-button-primary:not(:disabled).fc-button-active {
            background: #ffc107 !important;
            color: #000 !important;
        }

        .fc-col-header-cell-cushion {
            color: #ffc107 !important;
            font-weight: 700;
            text-decoration: none !important;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .fc-daygrid-day-number {
            color: #888;
            text-decoration: none !important;
            font-size: 0.9rem;
        }

        .fc-day-today .fc-daygrid-day-number {
            color: #ffc107 !important;
            font-weight: 700;
        }

        .fc-theme-standard td,
        .fc-theme-standard th {
            border-color: #222 !important;
        }

        .fc-scrollgrid {
            border-color: #2a2a2a !important;
        }

        .fc-daygrid-day:hover {
            background: #161616 !important;
        }

        .fc-event {
            border-radius: 4px !important;
            font-size: 0.75rem !important;
            padding: 2px 5px !important;
        }

        .fc-event.ticketed {
            background: #3a2500 !important;
            border-color: #ffc107 !important;
            color: #ffc107 !important;
        }

        .fc-event.full {
            background: #1a1a1a !important;
            border-color: #444 !important;
            color: #555 !important;
        }

        /* Selected day highlight */
        .fc-day-selected {
            background: rgba(255, 193, 7, 0.12) !important;
            outline: 2px solid #ffc107;
            outline-offset: -2px;
        }

        /* Booking action panel */
        #booking-action {
            max-width: 960px;
            margin: 1.25rem auto 0;
            background: rgba(10, 10, 10, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            border: 1px solid rgba(255, 193, 7, 0.3);
            padding: 1.25rem 1.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #booking-action .course-info { flex: 1; }
        #booking-action .course-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.2rem;
        }
        #booking-action .course-meta {
            font-size: 0.82rem;
            color: #aaa;
        }
        #booking-action .course-meta span {
            color: #ffc107;
            font-weight: 600;
        }

        #booking-next-btn {
            background: #ffc107;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 0.55rem 1.6rem;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, transform 0.1s;
        }
        #booking-next-btn:hover { background: #e6ac00; transform: scale(1.03); }

        /* Video background */
        .booking-video-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .booking-video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .booking-video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
        }

        .booking-main {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        #boonark-calendar {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 1.75rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 960px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <nav-bar></nav-bar>
    <!-- Video Background (fixed) -->
    <div class="booking-video-bg">
        <video autoplay muted loop playsinline>
            <source src="/video/BG-Booking-pagm.mp4" type="video/mp4">
        </video>
        <div class="booking-video-overlay"></div>
    </div>

    <main class="booking-main">
        <div class="container py-5">
            <div class="text-center mb-4" style="padding-top: 3rem;">
                <p style="font-size:0.78rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#ffc107; margin-bottom:0.5rem;">Boonark Restaurant</p>
                <h1 style="font-size:2.2rem; font-weight:800; color:#fff; text-shadow: 0 2px 12px rgba(0,0,0,0.6);">ตารางเวลา คอร์สอาหารในเทอมนี้</h1>
                <p style="font-size:1.1rem; color:#ccc;">เลือกวันที่ต้องการจองคอร์สอาหารของเรา</p>
            </div>
            <div id="boonark-calendar">
                <div id="calendar"></div>
            </div>

            <!-- Booking action panel (hidden until a date is selected) -->
            <div id="booking-action" style="display:none;">
                <div class="course-info">
                    <div class="course-name" id="booking-course-name"></div>
                    <div class="course-meta">
                        <span id="booking-course-date"></span>
                        &nbsp;·&nbsp;
                        <span id="booking-course-price"></span>
                    </div>
                </div>
                <button id="booking-next-btn">ถัดไป &rarr;</button>
            </div>
        </div>
    </main>

    <site-footer style="position:relative; z-index:1;"></site-footer>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
